{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px; margin:2rem auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" required id="id_username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" required id="id_password">
        </div>
        <div class="form-group">
            <label>Login as</label>
            <div style="display:flex; gap:1.5rem; margin-top:0.25rem;">
                <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                    <input type="radio" name="role" value="student" checked style="margin:0; width:auto; padding:0; border:none;"> Student
                </label>
                <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                    <input type="radio" name="role" value="teacher" style="margin:0; width:auto; padding:0; border:none;"> Teacher
                </label>
            </div>
        </div>
        {% if form_errors %}
            <div style="color:red; font-size:0.9rem; margin-bottom:1rem;">Invalid username or password.</div>
        {% endif %}
        <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>
    <p style="margin-top:1rem; text-align:center;">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
